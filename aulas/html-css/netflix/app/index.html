<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">

    <title>Netflix</title>
</head>

<body>
    <header class="header">

        <div class="header-left-side">
            <a href="#">
                <img src="./images/logo.jpg" alt="Logo Netflix" class="header-logo">
            </a>

            <ul class="header-left-menu">
                <a href="#">
                    <li class="header-left-menu-item">Início</li>
                </a>

                <a href="#">
                    <li class="header-left-menu-item">Séries</li>
                </a>

                <a href="#">
                    <li class="header-left-menu-item">Filmes</li>
                </a>
                
                <a href="#">
                    <li class="header-left-menu-item">Minha lista</li>
                </a>
                
            </ul>
        </div>

        <div class="header-right-side">
            <button>
                <i class="bi bi-search header-right-side-item"></i>
            </button>

            <button>
                <i class="bi bi-bell-fill header-right-side-item"></i>
            </button>
            
            <button class="header-user-icon-button">
                <img src="./images/user-icon.jpg" alt="Icone de usuario" class="header-user-icon">
                <i style="font-size: 8px; margin-left: 5px;" class="bi bi-caret-down-fill"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="section-main-content">
            <img src="./images/banner-home.png" alt="Banner principal" class="section-main-content-image">
            <div class="section-main-content-buttons">
                <button class="btn-primary btn"><i class="bi bi-play-fill"></i>Assistir</button>
                <button class="btn-secondary btn"><i class="bi bi-plus-lg"></i>Minha lista</button>
            </div>
        </section>

        <section>
            <h3>Filmes em destaque</h3>

            <div class="section-list-cards">

                <div class="section-list-card">
                    <h4 class="section-list-card-title">Inception</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_inception.png" alt="Inception">
                    </a>
                </div>
                
                <div class="section-list-card">
                    <h4 class="section-list-card-title">Interstellar</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_interstellar.png" alt="Interstellar">
                    </a>
                </div>
                
                <div class="section-list-card">
                    <h4 class="section-list-card-title">O Podero Chefão</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_poderoso-chefao.png" alt="O Poderoso Chefão">
                    </a>
                </div>

                <div class="section-list-card">
                    <h4 class="section-list-card-title">Breaking Bad</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_breaking-bad.png" alt="Breaking Bad">
                    </a>
                </div>

                <div class="section-list-card">
                    <h4 class="section-list-card-title">The Last of Us</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_the-last-of-us.png" alt="The Last of Us">
                    </a>
                </div>

                <div class="section-list-card">
                    <h4 class="section-list-card-title">Wandinha</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_wandinha.png" alt="Wandinha">
                    </a>
                </div>
                
                <div class="section-list-card">
                    <h4 class="section-list-card-title">John Wick</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_john-wick.png" alt="John Wick">
                    </a>
                </div>

                <div class="section-list-card">
                    <h4 class="section-list-card-title">Mad Max</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_mad-max.png" alt="Mad Max">
                    </a>
                </div>

                <div class="section-list-card">
                    <h4 class="section-list-card-title">Velozes e Furiosos 7</h4>
                    <a href="#">
                        <img class="section-list-card-image" src="./images/movie_velozes-e-furiosos-7.png" alt="Velozes e Furiosos 7">
                    </a>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
