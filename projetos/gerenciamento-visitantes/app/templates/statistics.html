{% extends 'base.html' %}

{% block title %}
Estatisticas
{% endblock %}

{% block content %}

<div>
    <h1>Estatisticas</h1>
    <div class="card card-custom p-2">
        <div class="d-flex justify-content-between">
            <h6>Total de visitantes</h6>
        </div>
        <p class="fs-1">{{ quant }}</p>

    <div class="card card-custom p-2">
        <div class="d-flex justify-content-between">
            <h6>visitantes normais</h6>
        </div>
        <p class="fs-1">{{ quant_normal }}</p>

    <div class="card card-custom p-2">
        <div class="d-flex justify-content-between">
            <h6>Visitantes vip</h6>
        </div>
        <p class="fs-1">{{ quant_vip }}</p>

    <div class="card card-custom p-2">
        <div class="d-flex justify-content-between">
            <h6>Visitantes premium</h6>
        </div>
        <p class="fs-1">{{ quant_premium }}</p>

    </div>
</div>

{% endblock %}
