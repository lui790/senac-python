<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">

    <title>Whatsapp</title>
</head>

<body style="background-color: black;">
    <div class="classe-div">
        <div class="div-icons">
            <button>
                <i class="bi bi-chat-left-dots-fill icons"></i>
            </button>
            <button>
                <i class="bi bi-people icons"></i>
            </button>
            <button>
                <i class="bi bi-circle icons"></i>
            </button>
            <button>
                <i class="bi bi-telephone icons"></i>
            </button>
            <button>
                <i class="bi bi-gear icons"></i>
            </button>
        </div>

        <div class="div-dms">
            <div class="dms-header">
                <h1 class="titles">Conversas</h1>

                <div class="dms-header-icon">
                    <button>
                        <i class="bi bi-search"></i>
                    </button>
                    <button>
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button>
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                </div>
            </div>

            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Pesquisar ou começar uma conversa">
            </div>

            <div class="dms-cards">
                <div class="dms-card">
                    <img class="dms-card-image" src="../images/Three-users.jpg" alt="Familia icone">
                    <div>
                        <h4 class="dms-card-title">Familia</h4>
                        <h5 class="dms-card-subtitles">Até mais! ❤️</h5>
                    </div>

                    <div style="margin-left: 225px; justify-content: center;">
                        <h6 class="dms-card-subtitles">15:42</h6>
                        <i style="padding-top: 20px; padding-left: 10px; color: #02E483;" class="bi bi-1-circle-fill"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
